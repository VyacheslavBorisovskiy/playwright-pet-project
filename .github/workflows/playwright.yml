name: Playwright Tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report

      - name: Upload Smoke Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke
          path: allure-report
          retention-days: 7

      - name: Upload Smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  regression:
    name: Regression Tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: npx playwright test --grep @regression
        env:
          BASE_URL: ${{vars.BASE_URL}}
          API_URL: ${{vars.API_URL}}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results -o allure-report

      - name: Upload Regression Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression
          path: allure-report
          retention-days: 7
      - name: Upload Regression Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: playwright-report/
          retention-days: 14

  deploy-report:
    name: Publish Allure Report
    needs:
      - smoke
      - regression
    if: always() && (needs.smoke.result == 'success' || needs.smoke.result == 'failure' || needs.regression.result == 'success' || needs.regression.result == 'failure')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download Smoke Allure report
        if: needs.smoke.result == 'success' || needs.smoke.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: allure-report-smoke
          path: allure-report

      - name: Download Regression Allure report
        if: needs.regression.result == 'success' || needs.regression.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: allure-report-regression
          path: allure-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report URL
        run: |
          echo "========================================="
          echo "Allure Report:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "========================================="
