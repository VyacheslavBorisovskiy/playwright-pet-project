name: Playwright Tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ============================================================
  # SMOKE TESTS
  # ============================================================
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: |
          npx playwright test \
            --grep @smoke \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Smoke Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.shardIndex }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # REGRESSION TESTS
  # ============================================================
  regression:
    name: Regression Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: |
          npx playwright test \
            --grep @regression \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Regression Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ matrix.shardIndex }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Regression Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # GENERATE AND DEPLOY ALLURE REPORTS
  # ============================================================
  deploy-report:
    name: Publish Allure Reports

    needs:
      - smoke
      - regression

    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Setup Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ==========================================================
      # DOWNLOAD SMOKE RESULTS
      # ==========================================================
      - name: Download Smoke Allure results
        if: needs.smoke.result == 'success' || needs.smoke.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-smoke-*
          path: allure/smoke/results
          merge-multiple: true

      # ==========================================================
      # DOWNLOAD REGRESSION RESULTS
      # ==========================================================
      - name: Download Regression Allure results
        if: needs.regression.result == 'success' || needs.regression.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-regression-*
          path: allure/regression/results
          merge-multiple: true

      # ==========================================================
      # RESTORE PREVIOUS ALLURE HISTORY
      # ==========================================================
      - name: Restore Allure history
        run: |
          mkdir -p allure/smoke/results/history
          mkdir -p allure/regression/results/history

          if git ls-remote --exit-code origin refs/heads/allure-history >/dev/null 2>&1; then
            echo "Allure history branch found."

            git fetch origin allure-history

            # Smoke history
            if git archive origin/allure-history smoke-history >/dev/null 2>&1; then
              git archive origin/allure-history smoke-history \
                | tar -x \
                    --strip-components=1 \
                    -C allure/smoke/results/history
            fi

            # Regression history
            if git archive origin/allure-history regression-history >/dev/null 2>&1; then
              git archive origin/allure-history regression-history \
                | tar -x \
                    --strip-components=1 \
                    -C allure/regression/results/history
            fi
          else
            echo "No previous Allure history found. This is the first run."
          fi

          echo ""
          echo "Smoke history:"
          find allure/smoke/results/history -type f 2>/dev/null || true

          echo ""
          echo "Regression history:"
          find allure/regression/results/history -type f 2>/dev/null || true

      # ==========================================================
      # GENERATE SMOKE REPORT
      # ==========================================================
      - name: Generate Smoke Allure report
        if: needs.smoke.result == 'success' || needs.smoke.result == 'failure'
        run: |
          npx allure generate \
            allure/smoke/results \
            -o allure/smoke/report

      # ==========================================================
      # GENERATE REGRESSION REPORT
      # ==========================================================
      - name: Generate Regression Allure report
        if: needs.regression.result == 'success' || needs.regression.result == 'failure'
        run: |
          npx allure generate \
            allure/regression/results \
            -o allure/regression/report

      # ==========================================================
      # PREPARE GITHUB PAGES
      # ==========================================================
      - name: Prepare GitHub Pages
        run: |
          rm -rf pages
          mkdir -p pages/allure

          # Smoke
          if [ -d "allure/smoke/report" ]; then
            mkdir -p pages/allure/smoke
            cp -R allure/smoke/report/. pages/allure/smoke/
          fi

          # Regression
          if [ -d "allure/regression/report" ]; then
            mkdir -p pages/allure/regression
            cp -R allure/regression/report/. pages/allure/regression/
          fi

          # Prevent Jekyll from modifying Allure files
          touch pages/.nojekyll

          echo "GitHub Pages structure:"
          find pages/allure -maxdepth 2 -type d | sort

      # ==========================================================
      # SAVE ALLURE HISTORY
      # ==========================================================
      - name: Save Allure history
        if: always()
        run: |
          set -e

          echo "Preparing Allure history..."

          rm -rf /tmp/allure-history
          mkdir -p /tmp/allure-history

          # ------------------------------------------------------
          # Smoke history
          # ------------------------------------------------------
          if [ -d "allure/smoke/report/history" ]; then
            echo "Copying Smoke history..."

            mkdir -p /tmp/allure-history/smoke-history

            cp -R allure/smoke/report/history/. \
              /tmp/allure-history/smoke-history/
          else
            echo "No Smoke history generated."
          fi

          # ------------------------------------------------------
          # Regression history
          # ------------------------------------------------------
          if [ -d "allure/regression/report/history" ]; then
            echo "Copying Regression history..."

            mkdir -p /tmp/allure-history/regression-history

            cp -R allure/regression/report/history/. \
              /tmp/allure-history/regression-history/
          else
            echo "No Regression history generated."
          fi

          # ------------------------------------------------------
          # Check whether there is anything to save
          # ------------------------------------------------------
          echo ""
          echo "History files to save:"
          find /tmp/allure-history -type f || true

          if [ -z "$(find /tmp/allure-history -type f -print -quit)" ]; then
            echo ""
            echo "No Allure history files were generated."
            echo "Nothing to push."
            exit 0
          fi

          # ------------------------------------------------------
          # Clone existing history branch if it exists
          # ------------------------------------------------------
          rm -rf /tmp/allure-history-repo

          if git ls-remote --exit-code origin refs/heads/allure-history >/dev/null 2>&1; then
            echo ""
            echo "Existing allure-history branch found."

            git clone \
              --branch allure-history \
              --single-branch \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              /tmp/allure-history-repo
          else
            echo ""
            echo "No allure-history branch found."
            echo "Creating it now."

            mkdir -p /tmp/allure-history-repo
            cd /tmp/allure-history-repo

            git init
            git checkout -b allure-history

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          # ------------------------------------------------------
          # Replace stored history
          # ------------------------------------------------------
          rm -rf /tmp/allure-history-repo/smoke-history
          rm -rf /tmp/allure-history-repo/regression-history

          if [ -d "/tmp/allure-history/smoke-history" ]; then
            cp -R /tmp/allure-history/smoke-history \
              /tmp/allure-history-repo/
          fi

          if [ -d "/tmp/allure-history/regression-history" ]; then
            cp -R /tmp/allure-history/regression-history \
              /tmp/allure-history-repo/
          fi

          # ------------------------------------------------------
          # Commit and push
          # ------------------------------------------------------
          cd /tmp/allure-history-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add smoke-history regression-history

          if git diff --cached --quiet; then
            echo ""
            echo "Allure history has not changed."
            exit 0
          fi

          git commit -m "Update Allure history"

          # For a newly initialized repository, add remote.
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

          git push origin allure-history

      # ==========================================================
      # CONFIGURE GITHUB PAGES
      # ==========================================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================================
      # UPLOAD GITHUB PAGES ARTIFACT
      # ==========================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      # ==========================================================
      # DEPLOY
      # ==========================================================
      - name: Deploy Allure reports
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================================
      # PRINT URLS
      # ==========================================================
      - name: Report URLs
        run: |
          echo "========================================="
          echo "Allure Reports"
          echo "========================================="
          echo ""
          echo "Smoke:"
          echo "${{ steps.deployment.outputs.page_url }}allure/smoke/"
          echo ""
          echo "Regression:"
          echo "${{ steps.deployment.outputs.page_url }}allure/regression/"
          echo ""
          echo "========================================="
